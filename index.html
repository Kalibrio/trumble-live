  <title>Trumble</title>
  <script>
    // THE LANDING PAGE IS THE FRONT DOOR (2026-08-24): a fresh web visit to
    // the root shows /landing/ first — the title screen — and PLAY NOW
    // returns here with the session flag set, so one visit sees it once.
    // Gated on the public hostname, so the native app (capacitor://localhost)
    // and local dev are never redirected; dev deep links (?play=) and the
    // landing's own handoff (?from=landing) pass straight through even when
    // storage is unavailable, so a redirect loop is impossible.
    (function () {
      if (location.hostname !== 'trumble.kalibrio.com') return;
      var q = location.search;
      // tool deep links pass through too (editor fix 2026-08-30): the
      // landing bounce dropped ?levels=1 — /level's documented handoff —
      // and the design tool silently landed on Home instead of opening
      if (q.indexOf('play=') !== -1 || q.indexOf('from=landing') !== -1
        || q.indexOf('levels=') !== -1 || q.indexOf('builder=') !== -1
        || q.indexOf('workshop=') !== -1 || q.indexOf('dash=') !== -1) return;
      try {
        if (sessionStorage.getItem('trumble.entered')) return;
      } catch (e) { return; } // no storage: fail open to the game
      location.replace('/landing/');
    })();
  </script>

  <!-- FTUE (onboarding, plan 6 / O1): the first paint is the game's own lit
       hand-off veil, not a blank page, while the bundle boots; main.ts
       lifts it as soon as the first screen (Level 1's card or the hub) is up -->
  <div id="boot-veil" aria-hidden="true" style="position:fixed;inset:0;z-index:8999;pointer-events:none;background:radial-gradient(circle 230px at 50% 36%,rgba(255,236,180,.5) 0%,rgba(255,204,120,.26) 40%,rgba(255,170,90,0) 100%),linear-gradient(180deg,#6c6197 0%,#554c7a 48%,#3c355d 100%);transition:opacity 220ms ease-out"></div>
  <script>setTimeout(function () { var v = document.getElementById('boot-veil'); if (v) v.remove(); }, 12000);</script>

  </div>
