<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150">
  <!-- FTUE ghost hand (movement track, 2026-10-12): a soft white pointing
       hand, fingertip at (36, 6). Drawn upright; CSS tilts it. -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e4f5"/>
    </linearGradient>
  </defs>
  <g stroke="#2a2140" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="url(#skin)">
    <!-- folded fingers -->
    <rect x="52" y="50" width="22" height="40" rx="11"/>
    <rect x="70" y="56" width="21" height="38" rx="10.5"/>
    <rect x="86" y="64" width="19" height="34" rx="9.5"/>
    <!-- palm -->
    <path d="M24 70 C22 58 26 52 36 52 L96 76 C108 82 108 100 104 112 C98 132 84 142 62 142 C40 142 28 128 26 110 Z"/>
    <!-- thumb -->
    <path d="M28 96 C16 92 6 84 8 74 C10 66 20 66 28 72 L40 84"/>
    <!-- index finger -->
    <rect x="24" y="4" width="25" height="86" rx="12.5"/>
  </g>
  <path d="M30 22 Q36 16 43 22" fill="none" stroke="#c9c1de" stroke-width="3" stroke-linecap="round"/>
  <!-- cuff -->
  <path d="M40 140 L86 140 L84 148 L42 148 Z" fill="#7d6cf0" stroke="#2a2140" stroke-width="4" stroke-linejoin="round"/>
</svg>
