  <style>#ptlab-root{z-index:20000;pointer-events:none;font-family:system-ui,-apple-system,Segoe UI,sans-serif;position:fixed;inset:0}#ptlab-root>*{pointer-events:auto}.pt-screen{padding:max(24px, env(safe-area-inset-top)) 16px 32px;background:linear-gradient(#6c6197 0%,#3c355d 100%);justify-content:center;align-items:flex-start;display:flex;position:fixed;inset:0;overflow-y:auto}.pt-card{color:#22203a;background:#fffdf8;border-radius:18px;width:100%;max-width:440px;padding:22px 20px;font-size:15px;line-height:1.45;box-shadow:0 12px 40px #00000047}.pt-card h1{margin:0 0 10px;font-size:24px}.pt-card h2{text-transform:uppercase;letter-spacing:.06em;color:#6a6586;margin:18px 0 8px;font-size:13px}.pt-card p{margin:0 0 12px}.pt-muted{color:#6a6586}.pt-small{font-size:13px}.pt-err{color:#b3261e;background:#fdecea;border-radius:10px;padding:8px 10px}.pt-btn{color:#fff;cursor:pointer;background:#ff8a3d;border:0;border-radius:14px;width:100%;min-height:48px;margin:10px 0 0;font:700 17px system-ui,sans-serif;display:block}.pt-btn:disabled{opacity:.45;cursor:default}.pt-btn.pt-alt{color:#3a3360;background:#ece8f7}.pt-btn .pt-muted{margin-left:6px;font-size:13px;font-weight:500}.pt-link{color:#5b4fd1;cursor:pointer;background:0 0;border:0;padding:10px 0 0;font:500 14px system-ui,sans-serif}.pt-field{color:#6a6586;margin:12px 0 0;font-size:13px;display:block}.pt-field input{box-sizing:border-box;color:#22203a;background:#fff;border:1px solid #d6d1e8;border-radius:12px;width:100%;min-height:44px;margin-top:4px;padding:0 12px;font:16px system-ui,sans-serif;display:block}.pt-check{align-items:flex-start;gap:10px;margin:10px 0 0;font-size:15px;display:flex}.pt-check input{flex:none;width:22px;height:22px;margin:0}.pt-more{color:#6a6586;margin-top:18px;font-size:14px}.pt-code{letter-spacing:.12em;color:#22203a;font-family:ui-monospace,Menlo,monospace}.pt-levels{grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 4px;display:grid}.pt-lvl{aspect-ratio:1;color:#6a6586;background:#ece8f7;border-radius:12px;flex-direction:column;justify-content:center;align-items:center;font-size:11px;display:flex}.pt-lvl b{color:#3a3360;font-size:18px}.pt-lvl.tried{background:#fff1d6}.pt-lvl.done{color:#1f7a3a;background:#d7f5df}.pt-list .pt-btn{text-align:left;padding:0 14px}.pt-pill{left:max(8px, env(safe-area-inset-left));bottom:max(8px, env(safe-area-inset-bottom));color:#fff;-webkit-backdrop-filter:blur(6px);opacity:.8;background:#1410328c;border-radius:999px;align-items:center;gap:6px;padding:4px 4px 4px 9px;font:600 11px system-ui,sans-serif;display:flex;position:fixed}.pt-pill button{color:#fff;cursor:pointer;background:#ffffff2e;border:0;border-radius:999px;padding:4px 9px;font:600 11px system-ui,sans-serif}.pt-dot{background:#9a96b8;border-radius:50%;width:7px;height:7px}.pt-pill.rec .pt-dot{background:#ff4d4d;animation:1.6s infinite pt-blink}@keyframes pt-blink{50%{opacity:.35}}.pt-toast{color:#22203a;text-align:center;background:#fffdf8;border-radius:18px;flex-direction:column;gap:6px;width:min(340px,88vw);padding:18px;font-size:15px;display:flex;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 12px 40px #0006}</style>
