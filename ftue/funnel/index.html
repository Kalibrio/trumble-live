<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Trumble Funnel</title>
  <style>
    :root {
      --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1f23; --muted: #626872; --line: #e1e3e6;
      --accent: #2f6fe4; --bad: #c73a2e; --bad-bg: #fdecea; --good: #1f8a4c; --chip: #eef2fa;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a; --panel: #1c1f24; --ink: #e9ebee; --muted: #9aa1ab; --line: #2d3138;
        --accent: #7aa7ff; --bad: #ff8a7a; --bad-bg: #3a2120; --good: #6fd39a; --chip: #252b36;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 16px; margin: 28px 0 10px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .sub a { color: var(--muted); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
    .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
    .filters label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    select, input, button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
    select[multiple] { min-height: 92px; }
    button { cursor: pointer; width: auto; }
    button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
    .row input { flex: 1 1 120px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    .tile .k { font-size: 12px; color: var(--muted); font-weight: 600; }
    .tile .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tile .c { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .funnel .step { display: grid; grid-template-columns: 110px 1fr 120px; gap: 10px; align-items: center; padding: 6px 4px; border-radius: 6px; }
    .funnel .step.worst { background: var(--bad-bg); }
    .bar { height: 14px; background: var(--chip); border-radius: 7px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); }
    .worst .bar i { background: var(--bad); }
    .loss { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
    .worst .loss { color: var(--bad); font-weight: 600; }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
    th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; }
    td small { color: var(--muted); }
    .toggle { display: inline-flex; gap: 6px; margin-left: 8px; vertical-align: middle; }
    .msg { padding: 14px; border-radius: 8px; background: var(--chip); }
    .err { color: var(--bad); }
    #gate { max-width: 420px; }
    #gate form { display: flex; gap: 8px; margin-top: 10px; }
    @media (max-width: 560px) { .funnel .step { grid-template-columns: 84px 1fr 92px; } }
  </style>
</head>
<body>
  <main>
    <h1>Trumble funnel</h1>
    <p class="sub">FTUE by install date, campaign, collection, level version and build. <span id="meta"></span> <a href="#" id="forget" hidden>Forget key</a></p>
    <section id="gate" class="panel" hidden>
      <strong>Viewer key</strong>
      <div class="sub">Asked once, kept in this browser only.</div>
      <form id="keyform"><input id="key" type="password" autocomplete="off" placeholder="paste the viewer key" /><button type="submit">Open</button></form>
      <p id="gateerr" class="err"></p>
    </section>
    <div id="app" hidden>
      <section class="panel filters" id="filters"></section>
      <h2>Headline</h2>
      <div class="tiles" id="tiles"></div>
      <h2>Drop-off</h2>
      <div class="panel funnel" id="funnel"></div>
      <h2>Compare <span class="toggle"><button id="byr" class="on" type="button">by campaign</button><button id="byk" type="button">by collection</button></span></h2>
      <div class="panel scroll"><table id="compare"></table></div>
      <h2>Every FTUE step</h2>
      <div class="panel scroll"><table id="beats"></table></div>
    </div>
    <p id="status" class="msg" hidden></p>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
